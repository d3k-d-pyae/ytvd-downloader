<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff4242'/%3E%3Cpath d='M9.5 7v10l8-5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<main class="wrap">
  <header class="hero">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M9 6.5v11l9-5.5z"/></svg>
      </span>
      <h1>YT Downloader</h1>
    </div>
    <p class="tagline">Paste a link, pick a quality, keep the video.</p>
  </header>

  <form id="fetch-form" class="fetch-bar" autocomplete="off">
    <input id="url-input" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..."
           aria-label="YouTube URL" spellcheck="false">
    <button type="submit" id="fetch-btn" class="btn btn-primary">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Fetch
    </button>
  </form>

  <div id="error-banner" class="banner hidden" role="alert" aria-live="polite"></div>

  <section id="video-card" class="card video-card hidden" aria-live="polite">
    <img id="video-thumb" alt="" referrerpolicy="no-referrer">
    <div class="video-meta">
      <h2 id="video-title"></h2>
      <p id="video-uploader"></p>
      <span id="video-duration" class="pill"></span>
    </div>
  </section>

  <section id="quality-section" class="hidden">
    <h3 class="section-title">Choose quality</h3>
    <div id="quality-list" class="quality-list" role="radiogroup" aria-label="Video quality"></div>
    <button id="download-btn" class="btn btn-primary btn-lg">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
      Download
    </button>
  </section>

  <section id="downloads-section" class="hidden">
    <h3 class="section-title">Downloads</h3>
    <div id="downloads-list" class="downloads-list"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
